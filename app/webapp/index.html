<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Media Library</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div class="toprow">
    <div class="brand">🎬 Media Library</div>
    <div class="top-actions">
      <button id="camToggle" class="cam-toggle" title="Hide theatre prints">🎭 All prints</button>
      <button id="camInfo" class="info-btn" title="About this filter">i</button>
    </div>
  </div>
  <div class="search-wrap">
    <input id="search" type="search" placeholder="Search movies, series…" autocomplete="off">
    <button id="clear" hidden>✕</button>
  </div>
</header>
<nav id="tabs">
  <button data-tab="home" class="active">Home</button>
  <button data-tab="movies">Movies</button>
  <button data-tab="series">Series</button>
</nav>
<main id="view"></main>
<div id="toast"></div>
<div id="camModal" class="modal" hidden>
  <div class="modal-box">
    <h3>✨ Clean prints only</h3>
    <p>When this is <b>ON</b>, theatre recordings are hidden across the whole app —
    <b>HDCAM, CAM, HDTS/TS, PreDVD, HDTC</b> — so you only see proper
    <b>BluRay / WEB-DL / HDTV</b> releases.</p>
    <p class="muted">Turn it <b>OFF</b> to see everything again, including cam prints.</p>
    <button class="btn" id="camModalClose">Got it</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
